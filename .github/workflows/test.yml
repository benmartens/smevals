name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install dependencies
      run: |
        pip install . --group dev
    - name: Run tests
      run: |
        pytest -v
  carton-packing:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@v7
    - name: Set up .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Build starter
      run: |
        dotnet build examples/carton-packing/fixtures/starter/CartonPacking.sln -c Release --nologo
    - name: Run helper contract tests
      run: |
        dotnet run --project examples/carton-packing/fixtures/starter/visible-tests/CartonPacking.VisibleTests -c Release --no-build -- --helpers-only
  query-optimizer:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - uses: actions/checkout@v7
    - name: Set up .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Build starter
      run: |
        dotnet build examples/query-optimizer/fixtures/starter/QueryOptimizer.sln -c Release --nologo
    - name: Run helper contract tests
      run: |
        dotnet run --project examples/query-optimizer/fixtures/starter/visible-tests/QueryOptimizer.VisibleTests -c Release --no-build -- --helpers-only

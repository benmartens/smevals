name: implement-optimizer
copilot_workspace: fixtures/starter
prompt: >-
  Implement QueryOptimizer.Optimize in the provided dependency-free .NET 10
  solution. Read README.md carefully and preserve the public JSON/CLI
  contract. The optimizer must return deterministic, valid physical plan trees
  while minimizing the supplied integer cost model. You may modify source
  files in the workspace, but do not add external packages or network
  dependencies. Run
  `dotnet run --project visible-tests\QueryOptimizer.VisibleTests` until the
  visible tests pass. When finished, respond with a concise summary of the
  algorithm and tests run.

name: default
checks:
  # Pull the SVG out of the model response - handles fenced code
  # blocks and surrounding prose. Fails if no SVG is found at all,
  # and being required that halts grading early.
  - checker: ../checkers/extract-svg
    creates: extracted.svg
    required: true

  # Strict validation of what was extracted
  - checker: xml-valid
    file: extracted.svg
    required: true

  # Render to a raster image, kept as a Grade artifact
  - checker: ../checkers/render-svg
    input: extracted.svg
    creates: render.png
    required: true

  # Score the rendered image with a vision model. The judge applies
  # every tag from this controlled vocabulary that is true of the image.
  - checker: ../checkers/llm-judge-image
    image: render.png
    model: openai-codex/gpt-5.6-sol
    tags:
      - recognizable_pelican
      - recognizable_bicycle
      - pelican_riding_bicycle
      - feet_on_pedals
      - wings_on_handlebars
      - correct_bicycle_frame_shape
      - facing_right_to_left
      - facing_left_to_right
      - wearing_a_hat
      - no_pelican_visible
      - no_bicycle_visible
    rubric: >-
      Score this image from 0 to 10. Award up to 3 points for containing
      a recognizable pelican, up to 3 points for a recognizable bicycle,
      up to 2 points for the pelican plausibly riding the bicycle, and
      up to 2 points for overall composition and charm.

scoring:
  # The Grade fails if any required Check fails; otherwise the
  # score from the final Check decides pass/fail. Scores are
  # normalized 0.0-1.0 per the check result contract.
  pass_threshold: 0.5
